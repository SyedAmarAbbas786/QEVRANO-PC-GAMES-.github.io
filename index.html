<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QEVRANO PC GAMES</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#070707;
    color:#eee;
    min-height:100vh;
    overflow-x:hidden;
}

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-track{
    background:#070707;
}

::-webkit-scrollbar-thumb{
    background:#d80000;
    border-radius:10px;
}


/* =========================================================
   HEADER
========================================================= */

header{
    position:sticky;
    top:0;
    z-index:1000;

    min-height:68px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 5%;

    background:rgba(7,7,7,.96);
    backdrop-filter:blur(16px);

    border-bottom:1px solid rgba(255,0,0,.18);
}

.logo{
    color:#fff;
    text-decoration:none;

    font-size:23px;
    font-weight:900;

    letter-spacing:1px;
}

.logo span{
    color:#e00000;
}

.logo small{
    display:block;
    color:#666;
    font-size:8px;
    letter-spacing:3px;
    margin-top:2px;
}

header nav{
    display:flex;
    align-items:center;
    gap:28px;
}

header nav a{
    color:#aaa;
    text-decoration:none;
    font-size:12px;
    font-weight:bold;
    transition:.25s;
}

header nav a:hover{
    color:#ff2020;
}


/* =========================================================
   COMPACT HERO
========================================================= */

.hero{
    position:relative;

    min-height:360px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:45px 20px 55px;

    overflow:hidden;

    background:
        linear-gradient(
            90deg,
            rgba(4,4,4,.97),
            rgba(8,8,8,.68),
            rgba(4,4,4,.96)
        ),
        url("./images/acbrotherhood.jpg") center/cover;
}

.hero:before{
    content:"";

    position:absolute;
    inset:0;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(210,0,0,.18),
            transparent 42%
        );

    pointer-events:none;
}

.hero:after{
    content:"";

    position:absolute;
    left:0;
    right:0;
    bottom:0;

    height:90px;

    background:linear-gradient(
        transparent,
        #070707
    );

    pointer-events:none;
}

.hero-content{
    position:relative;
    z-index:2;

    width:100%;
    max-width:850px;
}

.hero-badge{
    display:inline-block;

    padding:7px 14px;

    border:1px solid rgba(255,0,0,.4);
    border-radius:30px;

    background:rgba(130,0,0,.12);

    color:#ff2929;

    font-size:10px;
    font-weight:bold;

    letter-spacing:2px;

    margin-bottom:14px;
}

.hero h1{
    font-size:clamp(40px,6vw,68px);

    line-height:.95;

    font-weight:1000;

    letter-spacing:-3px;

    text-transform:uppercase;

    margin-bottom:14px;

    text-shadow:
        0 10px 40px rgba(0,0,0,.9);
}

.hero h1 span{
    color:#e00000;
}

.hero p{
    max-width:620px;

    margin:0 auto 22px;

    color:#aaa;

    font-size:14px;

    line-height:1.6;
}


/* =========================================================
   HERO SEARCH
========================================================= */

.hero-search{
    position:relative;

    max-width:570px;

    margin:auto;
}

.hero-search input{
    width:100%;

    padding:14px 18px;

    background:rgba(15,15,15,.94);

    color:#fff;

    border:1px solid #383838;

    border-radius:7px;

    outline:none;

    font-size:13px;

    transition:.25s;
}

.hero-search input:focus{
    border-color:#e00000;

    box-shadow:
        0 0 25px rgba(220,0,0,.15);
}

.hero-search input::placeholder{
    color:#777;
}


/* =========================================================
   QUICK STATS
========================================================= */

.stats{
    position:relative;
    z-index:5;

    max-width:1000px;

    margin:-25px auto 0;

    padding:0 20px;

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:12px;
}

.stat{
    padding:16px 15px;

    background:
        linear-gradient(
            145deg,
            #151515,
            #0d0d0d
        );

    border:1px solid #292929;

    border-radius:8px;

    text-align:center;

    box-shadow:
        0 12px 35px rgba(0,0,0,.4);
}

.stat strong{
    display:block;

    color:#fff;

    font-size:21px;

    margin-bottom:3px;
}

.stat span{
    color:#777;

    font-size:10px;

    text-transform:uppercase;

    letter-spacing:1px;
}


/* =========================================================
   ABOUT
========================================================= */

.info-section{
    max-width:1250px;

    margin:35px auto 30px;

    padding:0 20px;
}

.about-qevrano{
    padding:23px 25px;

    background:
        linear-gradient(
            120deg,
            rgba(100,0,0,.13),
            #101010 45%
        );

    border:1px solid #292929;

    border-radius:9px;

    position:relative;

    overflow:hidden;
}

.about-qevrano:after{
    content:"";

    position:absolute;

    width:180px;
    height:180px;

    right:-80px;
    top:-90px;

    background:rgba(210,0,0,.07);

    border-radius:50%;
}

.about-qevrano p{
    color:#999;

    font-size:13px;

    line-height:1.7;

    margin-bottom:7px;

    max-width:950px;
}

.about-qevrano p:last-child{
    margin-bottom:0;
}


/* =========================================================
   SECTION TITLES
========================================================= */

.section-title{
    display:flex;
    align-items:center;

    gap:10px;

    font-size:23px;

    margin-bottom:18px;
}

.section-title:before{
    content:"";

    width:4px;
    height:24px;

    background:#e00000;

    border-radius:4px;

    box-shadow:
        0 0 15px rgba(220,0,0,.35);
}


/* =========================================================
   MAIN CONTENT
========================================================= */

.content{
    max-width:1250px;

    margin:0 auto;

    padding:0 20px 60px;

    display:grid;

    grid-template-columns:minmax(0,1fr) 290px;

    gap:28px;
}


/* =========================================================
   FILTER BAR
========================================================= */

.filter-bar{
    width:100%;

    min-height:58px;

    display:flex;
    align-items:center;

    background:#101010;

    border:1px solid #292929;

    border-radius:8px;

    margin-bottom:25px;

    overflow:hidden;
}

.home-button{
    height:58px;

    padding:0 22px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#d90000;

    color:white;

    text-decoration:none;

    font-size:11px;

    font-weight:900;

    letter-spacing:.8px;

    white-space:nowrap;

    transition:.25s;
}

.home-button:hover{
    background:#ff1111;
}

.filter-item{
    flex:1;

    height:58px;

    display:flex;
    align-items:center;

    padding:0 8px;
}

.filter-item select{
    width:100%;

    height:38px;

    padding:0 10px;

    background:#171717;

    color:#ccc;

    border:1px solid #303030;

    border-radius:6px;

    outline:none;

    cursor:pointer;
}

.filter-item select:hover,
.filter-item select:focus{
    border-color:#d80000;
}


/* =========================================================
   GAME GRID
========================================================= */

.game-grid{
    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:18px;
}

.game-card{
    position:relative;

    background:
        linear-gradient(
            145deg,
            #151515,
            #0d0d0d
        );

    border:1px solid #282828;

    border-radius:9px;

    overflow:hidden;

    transition:.3s;

    box-shadow:
        0 10px 30px rgba(0,0,0,.28);
}

.game-card:hover{
    transform:translateY(-6px);

    border-color:#d80000;

    box-shadow:
        0 18px 40px rgba(210,0,0,.15);
}

.game-cover{
    width:100%;

    height:220px;

    display:block;

    object-fit:cover;

    transition:.45s;
}

.game-card:hover .game-cover{
    transform:scale(1.045);
}

.game-info{
    padding:15px;
}

.game-info h3{
    color:#fff;

    font-size:17px;

    margin-bottom:6px;
}

.game-info p{
    color:#999;

    font-size:11px;

    line-height:1.5;
}

.game-size{
    margin-top:5px;

    color:#bbb !important;
}

.download-btn{
    display:block;

    margin-top:12px;

    padding:10px;

    text-align:center;

    background:#d80000;

    color:#fff;

    text-decoration:none;

    border-radius:6px;

    font-size:11px;

    font-weight:900;

    letter-spacing:.5px;

    transition:.25s;
}

.download-btn:hover{
    background:#ff1717;

    box-shadow:
        0 8px 20px rgba(220,0,0,.25);
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar-search{
    position:relative;

    margin-bottom:20px;
}

.sidebar-search input{
    width:100%;

    padding:12px 13px;

    background:#111;

    color:#fff;

    border:1px solid #303030;

    border-radius:7px;

    outline:none;

    font-size:12px;
}

.sidebar-search input:focus{
    border-color:#d80000;
}

.sidebar-search input::placeholder{
    color:#666;
}

.sidebar-search-results{
    position:absolute;

    top:47px;
    left:0;
    right:0;

    background:#111;

    border:1px solid #303030;

    border-radius:7px;

    overflow:hidden;

    display:none;

    z-index:100;
}

.sidebar-result{
    padding:11px;

    color:#ccc;

    font-size:11px;

    border-bottom:1px solid #222;

    cursor:pointer;

    transition:.2s;
}

.sidebar-result:hover{
    background:#1c1c1c;

    color:#ff2020;
}


/* =========================================================
   SIDEBAR BOX
========================================================= */

.sidebar-box{
    background:
        linear-gradient(
            145deg,
            #141414,
            #0d0d0d
        );

    border:1px solid #282828;

    padding:16px;

    margin-bottom:20px;

    border-radius:8px;
}

.sidebar-title{
    font-size:15px;

    font-weight:900;

    margin-bottom:6px;

    padding-bottom:11px;

    border-bottom:1px solid #292929;
}

.sidebar-title:before{
    content:"";

    display:inline-block;

    width:4px;
    height:16px;

    background:#d80000;

    vertical-align:-3px;

    margin-right:8px;

    border-radius:2px;
}


/* =========================================================
   POPULAR
========================================================= */

.popular-card{
    display:flex;

    gap:10px;

    padding:10px 0;

    border-bottom:1px solid #242424;

    text-decoration:none;

    color:#fff;

    transition:.25s;
}

.popular-card:last-child{
    border-bottom:none;
}

.popular-card:hover{
    transform:translateX(4px);
}

.popular-card img{
    width:72px;

    height:57px;

    object-fit:cover;

    border-radius:5px;

    flex-shrink:0;

    border:1px solid #303030;
}

.popular-info{
    min-width:0;
}

.popular-info h4{
    color:#ddd;

    font-size:12px;

    margin-bottom:4px;

    line-height:1.3;
}

.popular-info p{
    color:#777;

    font-size:9px;

    line-height:1.4;
}

.popular-card:hover h4{
    color:#ff2222;
}


/* =========================================================
   PAGES
========================================================= */

.page{
    display:none;
}

.page.active-page{
    display:block;
}


/* =========================================================
   PAGINATION
========================================================= */

.pagination{
    display:flex;

    justify-content:center;
    align-items:center;

    gap:6px;

    margin-top
